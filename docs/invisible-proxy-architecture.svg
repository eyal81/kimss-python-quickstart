<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Kimss invisible proxy pattern</title>
  <desc id="desc">Your native OpenAI or Anthropic SDK talks to the Kimss Gateway. Hermis orchestration applies Agent ID, Entra ID, spend policies, and a kill switch, then forwards to your vaulted provider and writes a governed audit trail.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0618"/>
      <stop offset="45%" stop-color="#12082a"/>
      <stop offset="100%" stop-color="#0d001a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.34"/>
      <stop offset="42%" stop-color="#2d0059" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d001a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1140"/>
      <stop offset="100%" stop-color="#140a2c"/>
    </linearGradient>
    <linearGradient id="cardCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1460"/>
      <stop offset="100%" stop-color="#1a0a3a"/>
    </linearGradient>
    <linearGradient id="hermis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d0059"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4b0082"/>
      <stop offset="50%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#8a2be2"/>
    </marker>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#canvas)"/>
  <rect width="1280" height="640" rx="28" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1277" height="637" rx="26.5" fill="none" stroke="#4b0082" stroke-width="1.5"/>

  <text x="48" y="52" fill="#c4b5fd" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4">INVISIBLE PROXY PATTERN</text>
  <text x="48" y="88" fill="#e8eef8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Keep your native SDK. Hermis governs every hop.</text>
  <text x="48" y="118" fill="#93a4bf" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15">OpenAI and Anthropic clients stay unchanged - only <tspan fill="#c4b5fd">base_url</tspan> and <tspan fill="#c4b5fd">X-Kimss-Agent-Id</tspan> are added.</text>
  <rect x="1008" y="36" width="224" height="36" rx="18" fill="#2d0059" stroke="#8a2be2"/>
  <text x="1120" y="59" text-anchor="middle" fill="#e8eef8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">5-minute first call</text>

  <rect x="48" y="156" width="300" height="328" rx="22" fill="url(#card)" stroke="#4b0082"/>
  <text x="72" y="194" fill="#93a4bf" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">YOUR APPLICATION</text>
  <text x="72" y="230" fill="#e8eef8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Native SDK</text>
  <text x="72" y="258" fill="#a5b4fc" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14">Zero data-plane refactoring</text>
  <rect x="72" y="284" width="252" height="44" rx="12" fill="#1a0033" stroke="#4b0082"/>
  <text x="198" y="311" text-anchor="middle" fill="#e8eef8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14">OpenAI  |  /v1/chat/completions</text>
  <rect x="72" y="340" width="252" height="44" rx="12" fill="#1a0033" stroke="#4b0082"/>
  <text x="198" y="367" text-anchor="middle" fill="#e8eef8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14">Anthropic  |  /v1/messages</text>
  <text x="72" y="424" fill="#93a4bf" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13">Point the official client at Kimss.</text>
  <text x="72" y="448" fill="#c4b5fd" font-family="Consolas, JetBrains Mono, monospace" font-size="13">base_url = api.kimss.ai</text>

  <line x1="360" y1="300" x2="430" y2="300" stroke="url(#arrow)" stroke-width="3" marker-end="url(#head)"/>
  <text x="395" y="286" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">same SDK</text>

  <rect x="444" y="148" width="392" height="344" rx="24" fill="url(#cardCenter)" stroke="url(#stroke)" stroke-width="2" filter="url(#soft)"/>
  <rect x="444" y="148" width="392" height="344" rx="24" fill="none" stroke="#8a2be2" stroke-width="1.25"/>
  <text x="468" y="186" fill="#c4b5fd" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">KIMSS GATEWAY</text>
  <text x="468" y="220" fill="#e8eef8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">Invisible proxy</text>
  <text x="468" y="246" fill="#a5b4fc" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14">Dual-listener  |  identity  |  audit</text>

  <rect x="468" y="270" width="344" height="196" rx="18" fill="url(#hermis)" stroke="#8a2be2"/>
  <text x="490" y="302" fill="#c4b5fd" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">HERMIS ORCHESTRATION</text>
  <text x="490" y="332" fill="#ffffff" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Kimss orchestration framework</text>
  <text x="490" y="368" fill="#e8eef8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14">- Agent ID attribution</text>
  <text x="490" y="392" fill="#e8eef8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14">- Entra ID  |  spend policies</text>
  <text x="490" y="416" fill="#e8eef8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14">- Kill switch  |  tool loop</text>
  <text x="490" y="440" fill="#c4b5fd" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13">Hermis is the Kimss runtime.</text>

  <line x1="848" y1="300" x2="918" y2="300" stroke="url(#arrow)" stroke-width="3" marker-end="url(#head)"/>
  <text x="883" y="286" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">BYOI hop</text>

  <rect x="932" y="156" width="300" height="328" rx="22" fill="url(#card)" stroke="#4b0082"/>
  <text x="956" y="194" fill="#93a4bf" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">DATA PLANE</text>
  <text x="956" y="230" fill="#e8eef8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Vaulted provider</text>
  <text x="956" y="258" fill="#a5b4fc" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14">Your model  |  your key</text>
  <rect x="956" y="284" width="252" height="44" rx="12" fill="#1a0033" stroke="#4b0082"/>
  <text x="1082" y="311" text-anchor="middle" fill="#e8eef8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14">OpenAI  |  Anthropic  |  Azure</text>
  <rect x="956" y="340" width="252" height="44" rx="12" fill="#1a0033" stroke="#4b0082"/>
  <text x="1082" y="367" text-anchor="middle" fill="#e8eef8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14">Foundry  |  vLLM  |  custom</text>
  <text x="956" y="424" fill="#93a4bf" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13">Kimss never hosts inference.</text>
  <text x="956" y="448" fill="#c4b5fd" font-family="Consolas, JetBrains Mono, monospace" font-size="13">custom:your-vaulted-model</text>

  <rect x="48" y="516" width="1184" height="88" rx="20" fill="#140a2c" stroke="#4b0082"/>
  <text x="72" y="552" fill="#c4b5fd" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">GOVERNED AUDIT TRAIL</text>
  <text x="72" y="580" fill="#e8eef8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16">Every hop is identified, metered, and kill-switchable. Open Gateway - Recent calls.</text>
  <text x="1184" y="572" text-anchor="end" fill="#a5b4fc" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13">Article 12  |  Entra  |  spend caps</text>
</svg>
